<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="description" content="Free online timer and stopwatch. Set countdown timers, track time with a stopwatch, and use Chronoring instantly in your browser.">
<title>Online Timer & Stopwatch | Chronoring</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0f;--ink:#f4f0e7;--muted:#7c8290;--line:rgba(255,255,255,.09);--panel:rgba(20,23,31,.66);--gold:#e6bd61;--gold2:#9f7429;--red:#ff675f;--green:#85e0ba;box-sizing:border-box;color-scheme:dark}
*{box-sizing:inherit}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif;overflow-x:hidden;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
body:before{content:"";position:fixed;inset:-30%;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(230,189,97,.10),transparent 25%),radial-gradient(circle at 18% 20%,rgba(86,111,255,.07),transparent 22%);animation:drift 14s ease-in-out infinite alternate;z-index:-2}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.06)}}
.shell{width:min(1080px,100%);min-height:calc(100vh - 48px);margin:auto;display:grid;grid-template-rows:auto 1fr auto;animation:enter .8s cubic-bezier(.16,1,.3,1) both}@keyframes enter{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 24px}.brand{font-size:1.05rem;font-weight:700;letter-spacing:-.03em}.brand i{font-family:"Playfair Display",serif;color:var(--gold);font-weight:600}.brand-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:0 7px 2px 0;box-shadow:0 0 16px var(--gold)}.hint{font:500 .68rem "DM Mono",monospace;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:42px;align-items:center}.hero{display:flex;align-items:center;justify-content:center;min-width:0}.clock{position:relative;width:min(610px,74vh,100%);aspect-ratio:1;display:grid;place-items:center;isolation:isolate}.halo{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,rgba(230,189,97,.07),transparent 62%);filter:blur(20px);animation:breathe 5s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.06);opacity:.65}}
.orbit{position:absolute;inset:3%;border:1px solid rgba(255,255,255,.055);border-radius:50%;animation:spin 28s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;background:var(--gold)}.orbit:before{width:5px;height:5px;top:8%;left:26%;box-shadow:0 0 14px var(--gold)}.orbit:after{width:3px;height:3px;bottom:15%;right:18%;opacity:.45}@keyframes spin{to{transform:rotate(360deg)}}
.dial{position:absolute;inset:8%;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.006));box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),0 32px 80px rgba(0,0,0,.35);backdrop-filter:blur(12px)}svg.ring{position:absolute;inset:5%;width:90%;height:90%;transform:rotate(-90deg);overflow:visible}.track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.1}.progress{fill:none;stroke:url(#goldGradient);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(230,189,97,.55));transition:stroke-dashoffset .12s linear}.progress.alarm{stroke:var(--red);filter:drop-shadow(0 0 9px rgba(255,103,95,.7))}.tick{stroke:rgba(255,255,255,.08);stroke-width:.7}.tick.major{stroke:rgba(244,240,231,.28);stroke-width:1}.marker{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold));transition:fill .25s}.marker.alarm{fill:var(--red);filter:drop-shadow(0 0 7px var(--red))}
.core{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:11px}.eyebrow{font:500 .62rem "DM Mono",monospace;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}.readout{font:300 clamp(3.2rem,8vw,6.6rem) "DM Mono",monospace;letter-spacing:-.075em;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 0 28px rgba(230,189,97,.05)}.readout .sub{font-size:.38em;color:var(--muted);letter-spacing:-.04em}.readout.beat{animation:beat .28s ease}@keyframes beat{50%{transform:scale(1.012);text-shadow:0 0 24px rgba(230,189,97,.16)}}.status{font:400 .7rem "DM Mono",monospace;color:var(--muted);letter-spacing:.08em;min-height:1em}.status.alarm{color:var(--red)}
.clock.alarm{animation:alarmPulse .75s ease-in-out infinite}@keyframes alarmPulse{50%{transform:scale(1.012)}}.clock.alarm .dial{box-shadow:inset 0 0 0 1px rgba(255,103,95,.18),0 0 90px rgba(255,103,95,.08)}
.panel{border-left:1px solid var(--line);padding-left:32px;display:flex;flex-direction:column;gap:28px}.mode{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px}.tab{border:0;background:transparent;color:var(--muted);font:600 .74rem Manrope,sans-serif;padding:10px;border-radius:10px;cursor:pointer;transition:.25s}.tab.active{background:var(--ink);color:#101116;box-shadow:0 6px 18px rgba(0,0,0,.25)}.section-label{font:500 .62rem "DM Mono",monospace;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.preset{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--ink);font:500 .72rem "DM Mono",monospace;padding:11px 6px;border-radius:10px;cursor:pointer;transition:.2s}.preset:hover,.preset.selected{border-color:rgba(230,189,97,.55);background:rgba(230,189,97,.08);color:var(--gold);transform:translateY(-1px)}.custom{margin-top:8px;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:rgba(255,255,255,.025)}.custom input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:400 .75rem "DM Mono",monospace;padding:11px 0}.custom span{font:400 .65rem "DM Mono",monospace;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:var(--ink);font:600 .75rem Manrope,sans-serif;padding:13px 10px;cursor:pointer;transition:transform .16s,background .2s,border-color .2s}.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18)}.btn:active{transform:scale(.97)}.btn.primary{grid-column:1/-1;background:var(--gold);color:#18140a;border-color:transparent;padding:15px;box-shadow:0 10px 30px rgba(230,189,97,.12)}.btn.primary.running{background:rgba(255,255,255,.08);color:var(--ink);border-color:var(--line);box-shadow:none}.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}.ripple{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:ripple .65s ease-out forwards}@keyframes ripple{to{transform:translate(-50%,-50%) scale(12);opacity:0}}
.laps{max-height:155px;overflow:auto;display:flex;flex-direction:column;gap:5px;padding-right:3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.lap{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font:400 .67rem "DM Mono",monospace;color:var(--muted);animation:lapIn .3s cubic-bezier(.16,1,.3,1)}@keyframes lapIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}.lap .time{color:var(--ink)}.lap.best .split{color:var(--green)}.lap.worst .split{color:var(--red)}
footer{display:flex;justify-content:space-between;align-items:end;padding-top:24px;color:#555b66;font:400 .6rem "DM Mono",monospace;letter-spacing:.06em}.keys{display:flex;gap:12px}.keys b{font-weight:400;color:#8a909c;border:1px solid var(--line);border-radius:5px;padding:2px 5px}
@media(max-width:820px){.shell{min-height:auto}.stage{grid-template-columns:1fr;gap:20px}.clock{width:min(520px,92vw)}.panel{border-left:0;border-top:1px solid var(--line);padding:24px 0 0;width:min(520px,100%);margin:auto}.hint,.keys{display:none}footer{justify-content:center}.readout{font-size:clamp(3rem,15vw,5.5rem)}}
@media(max-width:480px){body{padding-left:14px;padding-right:14px}.clock{width:100%}.panel{gap:20px}.orbit{inset:1%}.dial{inset:7%}.readout{font-size:clamp(2.8rem,15vw,4.5rem)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="noise"></div>
<main class="shell">
<header><div class="brand"><span class="brand-dot"></span>chrono<i>ring</i></div><div class="hint">space · start / pause &nbsp;&nbsp; r · reset &nbsp;&nbsp; l · lap</div></header>
<section class="stage">
<div class="hero"><div class="clock" id="clock"><div class="halo"></div><div class="orbit"></div><div class="dial"></div>
<svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="goldGradient"><stop offset="0" stop-color="#9f7429"/><stop offset=".5" stop-color="#f4d889"/><stop offset="1" stop-color="#e6bd61"/></linearGradient></defs><circle class="track" cx="100" cy="100" r="90"/><circle id="progress" class="progress" cx="100" cy="100" r="90" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/><g id="ticks"></g><circle id="marker" class="marker" cx="190" cy="100" r="2.5"/></svg>
<div class="core"><div class="eyebrow" id="modeLabel">Stopwatch</div><div class="readout" id="readout" aria-live="off">00:00<span class="sub">.00</span></div><div class="status" id="status" aria-live="polite">ready</div></div></div></div>
<aside class="panel">
<div class="mode"><button class="tab active" data-mode="stopwatch">Stopwatch</button><button class="tab" data-mode="timer">Timer</button></div>
<div id="timerSettings" hidden><div class="section-label">Set duration</div><div class="presets"><button class="preset" data-min="1">01 min</button><button class="preset" data-min="5">05 min</button><button class="preset" data-min="10">10 min</button></div><label class="custom"><input id="customMin" type="number" min="0.1" max="1440" step="0.1" inputmode="decimal" placeholder="Custom duration"><span>MIN</span></label></div>
<div><div class="section-label">Controls</div><div class="controls"><button class="btn primary" id="btnStart">Start</button><button class="btn" id="btnLap" disabled>Lap</button><button class="btn" id="btnReset">Reset</button></div></div>
<div id="lapSection"><div class="section-label">Laps</div><div class="laps" id="laps"><div class="lap" id="emptyLaps"><span>—</span><span>No laps yet</span><span></span></div></div></div>
</aside></section>
<footer><span>CHRONORING / PRECISION IN MOTION</span><div class="keys"><span><b>SPACE</b> start</span><span><b>R</b> reset</span><span><b>L</b> lap</span></div></footer>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const clock=$('#clock'),progress=$('#progress'),ticks=$('#ticks'),marker=$('#marker'),readout=$('#readout'),statusEl=$('#status'),modeLabel=$('#modeLabel'),startBtn=$('#btnStart'),lapBtn=$('#btnLap'),resetBtn=$('#btnReset'),timerSettings=$('#timerSettings'),customMin=$('#customMin'),lapsEl=$('#laps'),lapSection=$('#lapSection');
for(let i=0;i<60;i++){const a=i*6*Math.PI/180,major=i%5===0,r1=major?80:85,r2=90,line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',100+r1*Math.cos(a));line.setAttribute('y1',100+r1*Math.sin(a));line.setAttribute('x2',100+r2*Math.cos(a));line.setAttribute('y2',100+r2*Math.sin(a));line.setAttribute('class','tick'+(major?' major':''));ticks.appendChild(line)}
let mode='stopwatch',running=false,raf=null,baseElapsed=0,startAt=0,duration=0,laps=[],alarmed=false,audioCtx=null,lastSecond=null;
const pad=n=>String(n).padStart(2,'0');
function stopwatchFmt(ms){ms=Math.max(0,ms);const cs=Math.floor(ms%1000/10),total=Math.floor(ms/1000),s=total%60,m=Math.floor(total/60)%60,h=Math.floor(total/3600);return{main:h?`${pad(h)}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`,sub:`.${pad(cs)}`}}
function timerFmt(ms){const total=Math.ceil(Math.max(0,ms)/1000),s=total%60,m=Math.floor(total/60)%60,h=Math.floor(total/3600);return h?`${pad(h)}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`}
function elapsed(){return baseElapsed+(running?performance.now()-startAt:0)}
function show(main,sub=''){readout.innerHTML=main+(sub?`<span class="sub">${sub}</span>`:'')}
function markerAt(frac){const a=frac*Math.PI*2;marker.setAttribute('cx',100+90*Math.cos(a));marker.setAttribute('cy',100+90*Math.sin(a))}
function ring(ms){let frac;if(mode==='stopwatch')frac=(ms%60000)/60000;else frac=duration?Math.min(1,ms/duration):0;progress.style.strokeDashoffset=100-frac*100;markerAt(frac)}
function frame(){const e=elapsed();let sec;if(mode==='stopwatch'){const f=stopwatchFmt(e);show(f.main,f.sub);ring(e);sec=Math.floor(e/1000)}else{const remain=duration-e;show(timerFmt(remain));ring(e);sec=Math.ceil(Math.max(0,remain)/1000);if(remain<=0&&!alarmed){finish();return}}if(sec!==lastSecond){lastSecond=sec;readout.classList.remove('beat');void readout.offsetWidth;readout.classList.add('beat')}if(running)raf=requestAnimationFrame(frame)}
function setRunningUI(on){startBtn.textContent=on?'Pause':(baseElapsed>0?'Resume':'Start');startBtn.classList.toggle('running',on);lapBtn.disabled=mode!=='stopwatch'||!on;statusEl.textContent=on?(mode==='stopwatch'?'running':'counting down'):(baseElapsed>0?'paused':'ready')}
function start(){if(running)return;if(mode==='timer'&&duration<=0){statusEl.textContent='choose a duration';customMin.focus();return}if(alarmed)reset();running=true;startAt=performance.now();clock.classList.remove('alarm');statusEl.classList.remove('alarm');setRunningUI(true);raf=requestAnimationFrame(frame)}
function pause(){if(!running)return;/* capture elapsed BEFORE changing running state */baseElapsed=elapsed();running=false;cancelAnimationFrame(raf);setRunningUI(false)}
function reset(){running=false;cancelAnimationFrame(raf);baseElapsed=0;alarmed=false;lastSecond=null;laps=[];clock.classList.remove('alarm');statusEl.classList.remove('alarm');progress.classList.remove('alarm');marker.classList.remove('alarm');renderLaps();setRunningUI(false);if(mode==='stopwatch'){show('00:00','.00');ring(0)}else{show(duration?timerFmt(duration):'00:00');ring(0)}}
function finish(){baseElapsed=duration;running=false;alarmed=true;cancelAnimationFrame(raf);show('00:00');ring(duration);clock.classList.add('alarm');progress.classList.add('alarm');marker.classList.add('alarm');statusEl.textContent="time's up";statusEl.classList.add('alarm');startBtn.textContent='Restart';startBtn.classList.remove('running');lapBtn.disabled=true;beep()}
function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();[0,.24,.48].forEach((d,i)=>{const t=audioCtx.currentTime+d,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i===2?'triangle':'sine';o.frequency.value=i===2?1046:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function addLap(){if(!running||mode!=='stopwatch')return;const now=elapsed(),prev=laps.length?laps[laps.length-1].total:0;laps.push({total:now,split:now-prev});renderLaps()}
function renderLaps(){if(!laps.length){lapsEl.innerHTML='<div class="lap" id="emptyLaps"><span>—</span><span>No laps yet</span><span></span></div>';return}const splits=laps.map(x=>x.split),min=Math.min(...splits),max=Math.max(...splits);lapsEl.innerHTML=[...laps].reverse().map((l,ri)=>{const i=laps.length-ri,tf=stopwatchFmt(l.total),sf=stopwatchFmt(l.split),cls=laps.length>1?(l.split===min?' best':l.split===max?' worst':''):'';return `<div class="lap${cls}"><span>${pad(i)}</span><span class="split">+${sf.main}${sf.sub}</span><span class="time">${tf.main}${tf.sub}</span></div>`}).join('')}
function selectDuration(min,source){duration=Math.round(min*60000);$$('.preset').forEach(b=>b.classList.toggle('selected',b===source));if(source)customMin.value='';reset()}
$$('.tab').forEach(tab=>tab.addEventListener('click',()=>{if(tab.dataset.mode===mode)return;$$('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');mode=tab.dataset.mode;modeLabel.textContent=mode==='stopwatch'?'Stopwatch':'Countdown';timerSettings.hidden=mode!=='timer';lapSection.hidden=mode!=='stopwatch';reset()}));
$$('.preset').forEach(b=>b.addEventListener('click',()=>selectDuration(Number(b.dataset.min),b)));
customMin.addEventListener('input',()=>{$$('.preset').forEach(b=>b.classList.remove('selected'));const v=Number(customMin.value);if(v>0){duration=Math.round(v*60000);if(!running){show(timerFmt(duration));ring(0);statusEl.textContent='ready'}}});customMin.addEventListener('change',()=>{const v=Number(customMin.value);if(v>0)selectDuration(v,null)});
startBtn.addEventListener('click',()=>running?pause():start());resetBtn.addEventListener('click',reset);lapBtn.addEventListener('click',addLap);
$$('.btn').forEach(btn=>btn.addEventListener('pointerdown',e=>{const r=btn.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';btn.appendChild(s);s.addEventListener('animationend',()=>s.remove())}));
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.code==='Space'){e.preventDefault();running?pause():start()}else if(e.key.toLowerCase()==='r')reset();else if(e.key.toLowerCase()==='l')addLap()});
reset();
})();
</script>
</body></html>
